<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">OSINT Threat Analyzer</h1>

        <form id="analyzeForm" class="space-y-4 mb-8">
            <div>
                <label for="target" class="block text-sm font-medium text-gray-700">IP-адрес, Домен или Email</label>
                <input type="text" id="target" name="target" required
                       placeholder="например: 8.8.8.8 или google.com"
                       class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <button type="submit" id="submitBtn"
                    class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none">
                Запустить проверку
            </button>
        </form>

        <div id="loading" class="hidden text-center py-4 text-indigo-600 font-medium">
            Идет анализ по базам данных...
        </div>

        <div id="resultArea" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-gray-50 p-4 rounded-lg border border-gray-200">
                <div>
                    <p class="text-sm text-gray-500">Цель</p>
                    <p class="text-xl font-bold text-gray-900" id="resTarget"></p>
                </div>
                <div class="text-right">
                    <p class="text-sm text-gray-500">Threat Score</p>
                    <p class="text-2xl font-bold text-red-600" id="resScore"></p>
                </div>
            </div>

            <div id="summaryCards" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            </div>

            <details class="group bg-gray-50 rounded-lg border border-gray-200">
                <summary class="flex justify-between items-center font-medium cursor-pointer list-none p-4 text-gray-700 hover:text-indigo-600">
                    <span>Подробный JSON-отчет</span>
                    <span class="transition group-open:rotate-180">
                        <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </span>
                </summary>
                <div class="p-4 pt-0 border-t border-gray-200 mt-2">
                    <pre id="jsonResult" class="text-xs text-gray-800 overflow-x-auto"></pre>
                </div>
            </details>
        </div>

        <div class="mt-8 pt-6 border-t border-gray-200">
            <button id="loadHistoryBtn" class="w-full py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none">
                Показать последние проверки
            </button>
            <div id="historyArea" class="mt-4 hidden space-y-3"></div>
        </div>
    </div>

    <script>
        document.getElementById('analyzeForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const target = document.getElementById('target').value;
            const btn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const resultArea = document.getElementById('resultArea');
            const summaryCards = document.getElementById('summaryCards');

            btn.disabled = true;
            resultArea.classList.add('hidden');
            loading.classList.remove('hidden');
            summaryCards.innerHTML = '';

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ target: target })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    document.getElementById('resTarget').textContent = data.data.target;
                    document.getElementById('resScore').textContent = data.data.threat_score;
                    document.getElementById('jsonResult').textContent = JSON.stringify(data.data, null, 2);

                    data.data.results.forEach(res => {
                        let cardHtml = `<div class="p-4 rounded-lg border shadow-sm bg-white border-gray-200">
                            <h3 class="font-bold text-gray-800 mb-2">${res.source}</h3>`;

                        if (res.error) {
                            cardHtml += `<p class="text-sm text-red-500">${res.error}</p>`;
                        } else {
                            if (res.source === 'AlienVault OTX') {
                                cardHtml += `<p class="text-sm text-gray-600">Найдено угроз (Pulses): <span class="font-bold ${res.data.pulses_found > 0 ? 'text-red-600' : 'text-green-600'}">${res.data.pulses_found}</span></p>`;
                            } else if (res.source === 'IP-API') {
                                cardHtml += `<p class="text-sm text-gray-600">Провайдер: <b>${res.data.isp}</b></p>
                                             <p class="text-sm text-gray-600">Локация: ${res.data.country}, ${res.data.city}</p>`;
                            } else if (res.source === 'Shodan IDB') {
                                const ports = res.data.ports ? res.data.ports.join(', ') : 'Нет';
                                cardHtml += `<p class="text-sm text-gray-600">Открытые порты: <b>${ports}</b></p>`;
                            } else if (res.source === 'HaveIBeenPwned') {
                                cardHtml += `<p class="text-sm text-gray-600">Утечек в базах: <span class="font-bold text-red-600">${res.data.length}</span></p>`;
                            }
                        }
                        cardHtml += `</div>`;
                        summaryCards.innerHTML += cardHtml;
                    });

                    resultArea.classList.remove('hidden');
                }
            } catch (error) {
                alert('Ошибка соединения с сервером');
            } finally {
                btn.disabled = false;
                loading.classList.add('hidden');
            }
        });

        document.getElementById('loadHistoryBtn').addEventListener('click', async () => {
            const historyArea = document.getElementById('historyArea');
            const btn = document.getElementById('loadHistoryBtn');

            btn.disabled = true;
            btn.textContent = 'Загрузка...';
            historyArea.classList.remove('hidden');
            historyArea.innerHTML = '';

            try {
                const response = await fetch('/api/history');
                const data = await response.json();

                if (data.status === 'success') {
                    if (data.data.length === 0) {
                        historyArea.innerHTML = '<p class="text-sm text-gray-500 text-center py-4">История пуста</p>';
                    } else {
                        data.data.forEach(item => {
                            const date = new Date(item.created_at).toLocaleString('ru-RU', {
                                day: '2-digit', month: '2-digit', year: 'numeric',
                                hour: '2-digit', minute: '2-digit'
                            });
                            historyArea.innerHTML += `
                                <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg border border-gray-200 hover:bg-gray-100 transition">
                                    <div>
                                        <p class="font-medium text-gray-900">${item.target}</p>
                                        <p class="text-xs text-gray-500">${date} | ${item.type}</p>
                                    </div>
                                    <div class="text-right">
                                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${item.threat_score > 0 ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}">
                                            Score: ${item.threat_score}
                                        </span>
                                    </div>
                                </div>
                            `;
                        });
                    }
                }
            } catch (error) {
                historyArea.innerHTML = '<p class="text-sm text-red-500 text-center py-4">Ошибка загрузки истории</p>';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Обновить историю';
            }
        });
    </script>
</body>
</html>
