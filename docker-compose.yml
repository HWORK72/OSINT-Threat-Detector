version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: always

  web:
    build: .
    # Порты наружу не публикуем: доступ только через внутреннюю сеть для Nginx
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - db
      - cache
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: osint_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  cache:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data: